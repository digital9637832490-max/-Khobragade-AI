name: Build Khobragade AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Recreate compatible Android project
        shell: bash
        run: |
          rm -rf android test
          rm -f analysis_options.yaml
          flutter create --platforms=android --org com.niteshkhobragade --project-name creator_studio .
          rm -rf test
          cat > analysis_options.yaml <<'EOF'
          analyzer:
            exclude:
              - build/**
          EOF

      - name: Configure Khobragade AI Android app
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          for perm in permissions:
              if perm not in s:
                  pos = s.find(">") + 1
                  s = s[:pos] + "\n    " + perm + s[pos:]

          s = re.sub(r'android:label="[^"]*"', 'android:label="Khobragade AI"', s, count=1)
          p.write_text(s, encoding="utf-8")

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app source
        run: flutter analyze lib --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Verify APK
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Khobragade AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Khobragade-AI-Android-APK
          path: android-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
