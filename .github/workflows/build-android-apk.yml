name: Build Khobragade AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Validate required secrets
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_WEB_CLIENT_ID ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Recreate compatible Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android test
          rm -f analysis_options.yaml
          flutter create --platforms=android --org com.niteshkhobragade --project-name creator_studio .
          rm -rf test
          cat > analysis_options.yaml <<'EOF2'
          analyzer:
            exclude:
              - build/**
          EOF2

      - name: Configure Khobragade AI Android app
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          for perm in permissions:
              if perm not in s:
                  pos = s.find(">") + 1
                  s = s[:pos] + "\n    " + perm + s[pos:]

          s = re.sub(r'android:label="[^"]*"', 'android:label="Khobragade AI"', s, count=1)
          p.write_text(s, encoding="utf-8")

      - name: Restore permanent release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
          cat > android/key.properties <<EOF2
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF2
          test -s android/app/upload-keystore.jks

      - name: Configure Gradle release signing
        shell: python
        run: |
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              s = kts.read_text(encoding="utf-8")
              header = '''import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nkeystoreProperties.load(FileInputStream(keystorePropertiesFile))\n\n'''
              if 'val keystoreProperties = Properties()' not in s:
                  s = header + s

              signing_block = '''\n    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n'''
              if 'create("release")' not in s:
                  marker = '\n    buildTypes {'
                  if marker not in s:
                      raise SystemExit('buildTypes block not found in build.gradle.kts')
                  s = s.replace(marker, signing_block + marker, 1)

              s = re.sub(
                  r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                  'signingConfig = signingConfigs.getByName("release")',
                  s,
              )
              kts.write_text(s, encoding="utf-8")

          elif groovy.exists():
              s = groovy.read_text(encoding="utf-8")
              header = '''def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file('key.properties')\nkeystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n\n'''
              if 'def keystoreProperties = new Properties()' not in s:
                  s = header + s

              signing_block = '''\n    signingConfigs {\n        release {\n            keyAlias keystoreProperties['keyAlias']\n            keyPassword keystoreProperties['keyPassword']\n            storeFile file(keystoreProperties['storeFile'])\n            storePassword keystoreProperties['storePassword']\n        }\n    }\n'''
              if 'signingConfigs {' not in s or "keystoreProperties['keyAlias']" not in s:
                  marker = '\n    buildTypes {'
                  if marker not in s:
                      raise SystemExit('buildTypes block not found in build.gradle')
                  s = s.replace(marker, signing_block + marker, 1)

              s = re.sub(
                  r'signingConfig\s+signingConfigs\.debug',
                  'signingConfig signingConfigs.release',
                  s,
              )
              groovy.write_text(s, encoding="utf-8")
          else:
              raise SystemExit('No Android app Gradle file found')

      - name: Show permanent signing SHA-1
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          RAW_SHA1=$(keytool -list -v             -keystore android/app/upload-keystore.jks             -alias "$ANDROID_KEY_ALIAS"             -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null             | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p'             | head -n 1 | tr -d '
')
          SHA1_HEX=$(printf '%s' "$RAW_SHA1" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if ! printf '%s' "$SHA1_HEX" | grep -Eq '^[0-9A-F]{40}$'; then
            echo "::error::Could not read valid permanent signing SHA-1"
            exit 1
          fi
          SHA1=$(printf '%s' "$SHA1_HEX" | sed 's/../&:/g;s/:$//')
          echo "ANDROID PACKAGE: com.niteshkhobragade.creator_studio"
          echo "SHA-1: $SHA1"
          echo "sha1_hex=$SHA1_HEX" >> "$GITHUB_OUTPUT"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          {
            echo "## Google Android OAuth values"
            echo ""
            echo "**Package name:** `com.niteshkhobragade.creator_studio`"
            echo ""
            echo "**SHA-1:** `$SHA1`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app source
        run: flutter analyze lib --no-fatal-infos

      - name: Build signed release APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: flutter build apk --release --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"

      - name: Verify APK and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          APK_SHA1_HEX=$("$APKSIGNER" verify --print-certs "$APK"             | sed -n -E 's/^.*certificate SHA-1 digest:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p'             | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if ! printf '%s' "$APK_SHA1_HEX" | grep -Eq '^[0-9A-F]{40}$'; then
            echo "::error::Could not read valid APK signing SHA-1"
            exit 1
          fi
          APK_SHA1=$(printf '%s' "$APK_SHA1_HEX" | sed 's/../&:/g;s/:$//')
          echo "SIGNED APK SHA-1: $APK_SHA1"
          echo "PERMANENT KEY SHA-1: ${{ steps.signing.outputs.sha1 }}"
          if [ "$APK_SHA1_HEX" != "${{ steps.signing.outputs.sha1_hex }}" ]; then
            echo "::error::APK signing SHA-1 does not match permanent keystore"
            exit 1
          fi
          echo "Signing certificate verified successfully."

      - name: Upload Khobragade AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Khobragade-AI-Android-APK
          path: android-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
